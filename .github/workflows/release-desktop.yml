# Builds the tagged desktop release matrix and publishes the release assets.
name: release-desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-13
          - arch: arm64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter pub get
          ./scripts/build_desktop_packages.sh \
            --platform macos \
            --arch "${{ matrix.arch }}" \
            --version "${VERSION_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --output-dir dist/macos-${{ matrix.arch }}

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-macos-${{ matrix.arch }}
          path: dist/macos-${{ matrix.arch }}/*
          if-no-files-found: error

  windows:
    name: windows-amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Windows amd64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          BRIDGE_CC: C:\msys64\ucrt64\bin\gcc.exe
        run: |
          flutter pub get
          ./scripts/build_desktop_packages.sh \
            --platform windows \
            --arch amd64 \
            --version "${VERSION_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --output-dir dist/windows-amd64

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-windows-amd64
          path: dist/windows-amd64/*
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter pub get
          ./scripts/build_desktop_packages.sh \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "${VERSION_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --output-dir dist/linux-${{ matrix.arch }}

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/*
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate release body
        env:
          TARGET_TAG: ${{ github.ref_name }}
          ASSET_DIR: dist/release
          OUTPUT_FILE: dist/release-body.md
        run: ./scripts/generate_release_body.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 云卷 ${{ github.ref_name }}
          body_path: dist/release-body.md
          files: dist/release/*
          fail_on_unmatched_files: true
